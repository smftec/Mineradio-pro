<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' mpro: data:; media-src 'self' mpro:; connect-src 'self'">
  <title>Mineradio pro</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app">
    <!-- 标题栏 -->
    <header id="titlebar">
      <div class="tb-brand">
        <img src="./assets/icon.png" alt="" draggable="false">
        <span>Mineradio <em>pro</em></span>
      </div>
      <div class="tb-search">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="搜索歌曲、艺术家、专辑…  Ctrl+K 聚焦">
        <button id="search-clear" class="search-clear" title="清空搜索" tabindex="-1">✕</button>
      </div>
      <div class="tb-actions">
        <button id="btn-update-badge" class="tb-btn update-badge hidden" title="发现新版本">
          <svg viewBox="0 0 24 24" class="ico"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>
          <span class="dot"></span>
        </button>
        <button id="btn-min" class="tb-btn" title="最小化"><svg viewBox="0 0 24 24" class="ico"><path d="M5 12h14"/></svg></button>
        <button id="btn-max" class="tb-btn" title="最大化"><svg viewBox="0 0 24 24" class="ico"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
        <button id="btn-close" class="tb-btn close" title="关闭"><svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </header>

    <div id="body">
      <!-- 侧边导航 -->
      <aside id="nav">
        <nav>
          <div class="nav-group">
            <button class="nav-item" data-view="home">
              <svg viewBox="0 0 24 24" class="ico"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
              <span>首页</span>
            </button>
            <button class="nav-item" data-view="library">
              <svg viewBox="0 0 24 24" class="ico"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              <span>曲库</span>
            </button>
            <button class="nav-item" data-view="artists"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>艺术家</span></button>
            <button class="nav-item" data-view="albums"><svg viewBox="0 0 24 24" class="ico"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg><span>专辑</span></button>
            <button class="nav-item" data-view="genres"><svg viewBox="0 0 24 24" class="ico"><path d="M12 3v18M3 8l18 8M21 8L3 16"/></svg><span>流派</span></button>
            <button class="nav-item" data-view="years"><svg viewBox="0 0 24 24" class="ico"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 11h16"/></svg><span>年代</span></button>
          </div>
          <div class="nav-group">
            <button class="nav-item" data-view="favorites">
              <svg viewBox="0 0 24 24" class="ico"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.4 4.5 6 4.5c2.2 0 3.6 1.2 6 3.8 2.4-2.6 3.8-3.8 6-3.8 3.6 0 5.6 3.9 4 7.2C19.5 16.4 12 21 12 21z"/></svg>
              <span>我喜欢的音乐</span>
            </button>
          </div>
          <div class="nav-group">
            <div class="nav-label">时间线</div>
            <button class="nav-item" data-view="recent-added"><svg viewBox="0 0 24 24" class="ico"><path d="M12 21a9 9 0 1 1 9-9"/><path d="M12 7v5l3 3"/><path d="M17 3l4 4h-6"/></svg><span>最近添加</span></button>
            <button class="nav-item" data-view="recent-played"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span>最近播放</span></button>
            <button class="nav-item" data-view="most-played"><svg viewBox="0 0 24 24" class="ico"><path d="M3 20h18M6 16v-5M11 16V8M16 16v-8M21 16V5"/></svg><span>播放最多</span></button>
          </div>
          <div class="nav-group">
            <div class="nav-label">歌单 <button id="btn-new-playlist" class="mini-add" title="新建歌单">+</button></div>
            <div id="nav-playlists"></div>
          </div>
        </nav>
        <div class="nav-footer">
          <button class="nav-item" id="nav-desktop-lyrics"><svg viewBox="0 0 24 24" class="ico"><rect x="3" y="5" width="18" height="11" rx="2"/><path d="M8 20h8"/></svg><span>桌面歌词</span><span id="dl-state" class="state off">关</span></button>
          <button class="nav-item" id="nav-mini"><svg viewBox="0 0 24 24" class="ico"><rect x="3" y="3" width="18" height="18" rx="3"/><rect x="10" y="12" width="8" height="6" rx="1"/></svg><span>迷你播放器</span></button>
          <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg><span>设置</span></button>
        </div>
      </aside>

      <!-- 内容区 -->
      <main id="content">
        <div id="view-root"></div>
      </main>
    </div>

    <!-- 播放条 -->
    <footer id="playerbar">
      <div class="pb-track">
        <img id="pb-cover" class="pb-cover" src="./assets/icon.png" alt="" draggable="false">
        <div class="pb-meta">
          <div id="pb-title" class="pb-title">未在播放</div>
          <div id="pb-artist" class="pb-artist">—</div>
        </div>
        <button id="pb-fav" class="pb-iconbtn" title="喜欢">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.4 4.5 6 4.5c2.2 0 3.6 1.2 6 3.8 2.4-2.6 3.8-3.8 6-3.8 3.6 0 5.6 3.9 4 7.2C19.5 16.4 12 21 12 21z"/></svg>
        </button>
      </div>
      <div class="pb-center">
        <div class="pb-controls">
          <button id="pb-shuffle" class="pb-iconbtn" title="随机播放">
            <svg viewBox="0 0 24 24" class="ico"><path d="M16 3h5v5M21 3l-7.5 7.5M8 21H3v-5M3 21l7.5-7.5M16 21h5v-5M21 21l-6-6M3 3l6 6"/></svg>
          </button>
          <button id="pb-prev" class="pb-iconbtn big" title="上一首">
            <svg viewBox="0 0 24 24" class="ico"><path d="M19 20L9 12l10-8v16z"/><rect x="5" y="4" width="2" height="16" rx="1"/></svg>
          </button>
          <button id="pb-play" class="pb-playbtn" title="播放/暂停">
            <svg id="pb-icon-play" viewBox="0 0 24 24" class="ico"><path d="M7 4.5v15l13-7.5z"/></svg>
            <svg id="pb-icon-pause" viewBox="0 0 24 24" class="ico hidden"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>
          </button>
          <button id="pb-next" class="pb-iconbtn big" title="下一首">
            <svg viewBox="0 0 24 24" class="ico"><path d="M5 4l10 8-10 8V4z"/><rect x="17" y="4" width="2" height="16" rx="1"/></svg>
          </button>
          <button id="pb-repeat" class="pb-iconbtn" title="循环模式">
            <svg id="pb-icon-repeat" viewBox="0 0 24 24" class="ico"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
            <span id="pb-repeat-one" class="repeat-one hidden">1</span>
          </button>
        </div>
        <div class="pb-progress">
          <span id="pb-cur">0:00</span>
          <div id="pb-seekbar" class="seekbar"><div class="seek-fill" id="pb-fill"><div class="seek-dot"></div></div></div>
          <span id="pb-dur">0:00</span>
        </div>
      </div>
      <div class="pb-right">
        <canvas id="pb-spectrum" class="pb-spectrum" width="176" height="56" aria-hidden="true"></canvas>
        <button id="pb-queue" class="pb-iconbtn" title="播放队列">
          <svg viewBox="0 0 24 24" class="ico"><path d="M3 6h13M3 12h13M3 18h9"/><circle cx="19" cy="16" r="2.5"/><path d="M21.5 16V8l-4 1"/></svg>
        </button>
        <button id="pb-lyrics" class="pb-iconbtn" title="歌词视图">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
        </button>
        <button id="pb-mute" class="pb-iconbtn" title="静音">
          <svg id="pb-icon-vol" viewBox="0 0 24 24" class="ico"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <div id="pb-volbar" class="seekbar vol"><div class="seek-fill" id="pb-volfill"><div class="seek-dot"></div></div></div>
        <button id="pb-mini" class="pb-iconbtn" title="迷你播放器">
          <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="3" width="18" height="18" rx="3"/><rect x="10" y="12" width="8" height="6" rx="1"/></svg>
        </button>
      </div>
    </footer>

    <div id="toast-wrap"></div>
    <div id="ctx-menu" class="ctx-menu hidden"></div>
  </div>

  <audio id="audioA"></audio>
  <audio id="audioB"></audio>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/visualizer.js"></script>
</body>
</html>
